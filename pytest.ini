[pytest]
testpaths =
    cube_encoder/tests
    cube_split/tests
    cube_web/tests
markers =
    e2e: tests that require external Ray, MinIO, and PostgreSQL services
    quality_repository_opengauss: actual OpenGauss quality repository acceptance; never skipped
    scene_repository_opengauss: actual OpenGauss scene repository acceptance; never skipped
    dataset_deletion_real: dataset deletion plan validated against the live schema; never skipped
